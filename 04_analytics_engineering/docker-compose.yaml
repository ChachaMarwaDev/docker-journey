services:
  pgdatabase:
    image: postgres:18
    container_name: pgdatabase
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ny_taxi
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - pg-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8085:80"
    depends_on:
      - pgdatabase
    networks:
      - pg-network

  # New DuckDB service with dbt
  duckdb-dbt:
    build:
      context: ./
      dockerfile: Dockerfile.duckdb
    container_name: duckdb-dbt
    volumes:
      - .:/workspace
      - duckdb_data:/data
    working_dir: /workspace
    command: tail -f /dev/null  # Keeps container running
    networks:
      - pg-network
    depends_on:
      - pgdatabase
    environment:
      - POSTGRES_HOST=pgdatabase
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ny_taxi

volumes:
  ny_taxi_postgres_data:
  pgadmin_data:
  duckdb_data:

networks:
  pg-network:
    driver: bridge