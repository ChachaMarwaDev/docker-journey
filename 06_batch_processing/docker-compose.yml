# ============================================================
# Spark Course - docker-compose.yml
# Place this file at: 06_batch_processing/docker-compose.yml
# ============================================================

services:

  # ---------------------------------------------------------
  # SPARK service: This is what VS Code / DevContainer uses.
  # You write and run your Python/Spark code here.
  # ---------------------------------------------------------
  spark:
    platform: linux/amd64
    build:
      context: .               # Project root = 06_batch_processing/
      dockerfile: setup/Dockerfile
    container_name: spark-course
    volumes:
      - ./code:/workspace/code  # Your local code/ folder → inside container
    working_dir: /workspace/code
    ports:
      - "4040:4040"             # Spark Web UI (view running jobs)
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]

  # ---------------------------------------------------------
  # JUPYTER service: Optional. Opens a notebook in your browser.
  # Visit http://localhost:8888 after running:
  #   docker compose up jupyter
  # ---------------------------------------------------------
  jupyter:
    platform: linux/amd64
    build:
      context: .
      dockerfile: setup/Dockerfile
    container_name: jupyter-course
    volumes:
      - ./code:/workspace/code
    working_dir: /workspace/code
    ports:
      - "8888:8888"             # Jupyter Notebook in browser
      - "4041:4040"             # Spark UI for jupyter (different port to avoid conflict)
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    command: >
      bash -c "
        /opt/venv/bin/jupyter notebook
          --ip=0.0.0.0
          --port=8888
          --no-browser
          --allow-root
          --NotebookApp.token=''
          --NotebookApp.password=''
          --notebook-dir=/workspace/code
      "
    depends_on:
      - spark
