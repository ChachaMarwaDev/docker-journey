services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ny_taxi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bruin-network

  bruin:
    build: .
    image: bruin-project:latest
    volumes:
      - .:/workspace
    networks:
      - bruin-network
    depends_on:
      - postgres
    command: tail -f /dev/null

volumes:
  postgres_data:

networks:
  bruin-network: